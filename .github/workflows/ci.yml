name: CI

on: 
  push:
  pull_request:

jobs:
  build:
    # Tests and coverage reporting do not need to modify repository state.
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Checked 2026-07-20: PyPy releases only support Python through 3.11.
        python-version: ["3.10", 3.11, 3.12, 3.13, 3.14, pypy3.11]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync
    - name: Run tests
      shell: bash
      run: |
        uv run pytest
        if uv run which mypy; then uv run mypy ifaddr; fi
        uv run ruff format --check
    # Coveralls won't work here trivially because it can't ingest coverage.xml, so Codecov it is.
    # https://github.com/coverallsapp/github-action/issues/30
    - name: Report coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
